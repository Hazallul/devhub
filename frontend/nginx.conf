# Üretim modunda derlenmiş arayüzü sunar. Adres değişmesin diye geliştirme sunucusuyla aynı portu (5173) dinler.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Dosya adlarında içerik özeti olduğu için uzun süre önbelleğe alınabilir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tek sayfalı uygulama: bilinmeyen her adres index.html'e düşer, yönlendirmeyi React yapar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
