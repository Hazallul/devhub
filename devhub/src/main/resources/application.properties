server.port=8081
spring.application.name=devhub
spring.profiles.active=dev

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expirationMs=86400000

# DataSource settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Sistem İzleme ayarları ve izlenen servisler: monitoring.yml
spring.config.import=classpath:monitoring.yml
