server.port=8081
spring.application.name=devhub
spring.profiles.active=dev

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expirationMs=86400000

# DataSource settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Sistem İzleme ayarları ve izlenen servisler: monitoring.yml
spring.config.import=classpath:monitoring.yml

# Yüklenen dosyalar: üst sınır en büyük dosya türüne (yedek dosyası) göredir; her uç kendi sınırını ayrıca denetler
# (doküman görseli 5 MB, görev/talep eki 10 MB).
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB

# Veritabanı yedekleri: Docker'da bilgisayardaki devhub/backups klasörü. Otomatik yedek kaç günde bir alınır, kaç tanesi saklanır.
devhub.backup.dir=${DEVHUB_BACKUP_DIR:backups}
devhub.backup.interval-days=${DEVHUB_BACKUP_INTERVAL_DAYS:3}
devhub.backup.keep-auto=${DEVHUB_BACKUP_KEEP:10}

# E-posta (şifremi unuttum kodları). Geliştirmede Mailpit: gelen kutusu http://localhost:8025, kimseye ulaşmaz.
# Gerçek sunucu için SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD ortam değişkenleri verilir (şifreler depoya yazılmaz).
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
devhub.mail.from=${DEVHUB_MAIL_FROM:DevHub <noreply@devhub.local>}
