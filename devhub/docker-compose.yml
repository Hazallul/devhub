services:
  mysql:
    image: mysql:8.0
    container_name: devhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devhub
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: devhub-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/devhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - DEVHUB_MONITORING_DOCKER_URL=http://docker-proxy:2375
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - DEVHUB_BACKUP_DIR=/app/backups
    # Veritabanı yedekleri bilgisayarda devhub/backups klasöründe durur; container silinse de kaybolmaz.
    volumes:
      - ./backups:/app/backups
    depends_on:
      - mysql
      - docker-proxy
      - mailpit
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      target: dev
    container_name: devhub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Sistem İzleme sayfası konteyner durumlarını buradan okur. Backend Docker soketine doğrudan erişmez:
  # vekil yalnızca okuma uçlarına (konteyner listesi/istatistikleri, motor bilgisi) izin verir, yazma (POST) kapalıdır.
  # Port dışarı açılmaz; yalnızca compose ağındaki servisler erişebilir.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: devhub-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Geliştirme e-posta kutusu: backend'in gönderdiği tüm e-postalar burada toplanır, dışarı çıkmaz.
  # Gelen kutusu: http://localhost:8025 (yalnızca bu bilgisayardan erişilir). SMTP portu dışarı açılmaz.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: devhub-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  mysql_data:
