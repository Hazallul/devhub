version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: devhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devhub
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: devhub-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/devhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - DEVHUB_MONITORING_DOCKER_URL=http://docker-proxy:2375
    depends_on:
      - mysql
      - docker-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build: ../frontend
    container_name: devhub-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Sistem İzleme sayfası konteyner durumlarını buradan okur. Backend Docker soketine doğrudan erişmez:
  # vekil yalnızca okuma uçlarına (konteyner listesi/istatistikleri, motor bilgisi) izin verir, yazma (POST) kapalıdır.
  # Port dışarı açılmaz; yalnızca compose ağındaki servisler erişebilir.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: devhub-docker-proxy
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  mysql_data:
